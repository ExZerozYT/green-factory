name: Natural Green Dot Factory

on:
  schedule:
    # รันบ่อยขึ้นเล็กน้อย (ทุกๆ 1 ชั่วโมงครึ่ง) เพื่อให้มีโอกาสสุ่มได้มากขึ้น
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Random Commit Logic
        run: |
          # สุ่มรอ 1 - 300 วินาที เพื่อไม่ให้เวลาซ้ำกันเป๊ะ
          sleep $(( ( RANDOM % 300 )  + 1 ))
          
          # สุ่มจำนวนรอบในการ Commit (1 ถึง 4 รอบ)
          ITERATIONS=$(( ( RANDOM % 4 )  + 1 ))
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          for i in $(seq 1 $ITERATIONS)
          do
            echo "Snake food added at $(date)" >> daily_report.txt
            git add daily_report.txt
            git commit -m "Natural Commit #$i: $(date)"
          done

      - name: Push changes
        run: git push
